# 详情页内容
icon: /images/projects/icons/selecttext.png
tagline: Copy text you can't select.
intro: >-
  Text inside images, videos, canvas apps and pages that block selection can't be copied. SelectText lets you drag a
  box around it instead, recognizes the text, and copies the part you click.
screenshot:
  src: /images/projects/selecttext.jpg
  alt: SelectText recognizing a headline on GitHub's home page, with a menu to copy or translate it
install:
  note: Chrome, Edge, Firefox and Safari on macOS and iOS · Free and open source

blocks:
  - type: steps
    title: How it works
    items:
      - Click the SelectText icon in the toolbar.
      - Drag to select the area with the text.
      - Wait a moment while the text is recognized.
      - Click a text block to copy it. Press `Esc` to exit.

  - type: list
    title: Good for
    items:
      - title: Images and screenshots.
        body: Text baked into a picture.
      - title: Paused videos.
        body: Slides, code or captions on screen.
      - title: Locked-down pages.
        body: Sites that disable selection, or text drawn on a canvas.

privacy:
  - >-
    To recognize text, the image of the area you select is sent to Google Lens. Nothing else on the page is captured.
  - >-
    The only other request is an anonymous usage ping, at most once a day: a random install ID, the extension version
    and your browser language.
