# 详情页内容
icon: /images/projects/icons/twitter-blocker.png
tagline: Block one account in a click, or thousands in the background.
intro: >-
  Blocking on X is one account at a time, behind a menu and a confirmation. Twitter Blocker puts a block button on
  every tweet, and works through long block lists in the background, waiting out X's rate limits so you don't have to.
screenshot:
  src: /images/projects/twitter-blocker.jpg
  alt: The X timeline with Twitter Blocker's Quick Block button on each tweet
install:
  note: Chrome, Edge, Firefox and Safari, including mobile · Free up to 150 accounts per run, $19.99 lifetime for unlimited

blocks:
  - type: features
    title: Two ways to block
    items:
      - title: Quick Block
        body: >-
          A block button on every tweet. One click starts a 3-second countdown with an **Undo** button, then the
          account is blocked. No menus, no confirmation dialog.
      - title: Batch blocking
        body: >-
          Build a list from a CSV file, X's official data export (`block.js`) or a user search, then run it. Each
          account shows whether it succeeded, failed or was skipped.

  - type: list
    title: The details
    items:
      - title: Keeps going without you.
        body: Blocking runs in the background. Close the tab and come back later, even days later for very long lists.
      - title: Rate limits handled.
        body: >-
          It counts requests itself, pauses before X's limit is hit, and resumes where it stopped. Nothing in the list
          is dropped, and it leaves headroom for blocks you do by hand.
      - title: Move your block list.
        body: Import the `block.js` from X's data export to carry your block list over to a new account.
      - title: No API key.
        body: It works through your logged-in X session. There is no developer account or token to set up.

  - type: list
    title: Free or licensed
    items:
      - title: Free.
        body: Quick Block, CSV import, search and background blocking, up to 150 accounts per run.
      - title: Licensed, $19.99 once.
        body: Unlimited accounts per run, priority email support and lifetime updates.
    note: >-
      Need to filter feeds rather than block accounts? See [AI Feed Filter](/project/twitter-filter) (formerly Twitter
      Filter), which can collapse, hide or block by AI topics and rules.

privacy:
  - >-
    Your block lists stay in your browser, and blocking requests go only to X, through your own session. Nothing about
    the accounts you block is sent anywhere else.
  - >-
    The extension sends an anonymous usage ping, at most once a day: a random install ID, the extension version and
    your browser language. Activating a license checks the code with the license server.
