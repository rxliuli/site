# 详情页内容
icon: /images/projects/icons/background.png
tagline: Your own picture behind every website.
intro: >-
  New tab pages get wallpapers. Websites don't. Background lays an image you choose softly over every page you visit,
  faint enough that text stays readable, so the web feels a little more like yours.
screenshot:
  src: /images/projects/background.jpg
  alt: Google's home page with a faint pony illustration behind it
install:
  note: Chrome, Firefox and Safari · Free and open source

blocks:
  - type: steps
    title: How it works
    items:
      - Open the options page and upload an image.
      - Visit any site. The image appears behind the page at low opacity.
      - On a site where you'd rather not see it, open the popup and turn it off for that site.

  - type: list
    title: The details
    items:
      - title: Never in the way.
        body: The image is drawn at 10% opacity and ignores the mouse, so links, buttons and text work as usual.
      - title: Remembered.
        body: Your image is kept in the browser's IndexedDB and stays across sessions.
      - title: Per-site off switch.
        body: Sites you turn it off for are remembered too.

privacy:
  - Your image is stored in your browser and is never uploaded. Background makes no network requests and has no analytics.
