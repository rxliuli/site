# 详情页内容
icon: /images/projects/icons/gmail-notifier.png
tagline: New Gmail, right in your toolbar.
intro: >-
  Keeping a Gmail tab open just to watch for new mail is a waste of a tab. Gmail Notifier checks your inbox in the
  background, shows the unread count on its icon and sends a desktop notification when something arrives.
screenshot:
  src: /images/projects/gmail-notifier.jpg
  alt: The Gmail Notifier popup listing an unread email with quick action buttons
install:
  note: Chrome, Edge, Firefox and Safari · Free and open source

blocks:
  - type: features
    title: Deal with mail without opening Gmail
    items:
      - title: Desktop notifications
        body: New mail shows up as a notification within about half a minute.
      - title: Quick actions
        body: Mark as read, archive or delete a message straight from the popup.
      - title: Mark all as read
        body: Clear the unread count in one click.
      - title: Light and dark
        body: The popup follows your system theme.

  - type: list
    title: The details
    items:
      - title: No sign-in.
        body: It uses the Gmail session already in your browser. There is no password to enter and no OAuth app to trust.
      - title: Gmail only.
        body: It only has access to mail.google.com.

privacy:
  - Your mail is read from Gmail by your own browser and never passes through any other server.
  - >-
    The only other request is an anonymous usage ping, at most once a day: a random install ID, the extension version
    and your browser language.
