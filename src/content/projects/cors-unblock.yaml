# 详情页内容
icon: /images/projects/icons/cors-unblock.png
tagline: Let the web apps you trust make cross-origin requests.
intro: >-
  Native apps can call any API. Web apps can't, because of CORS. CORS Unblock gives that ability back to the web apps
  you choose, one approved domain at a time, by rewriting response headers in your browser.
screenshot:
  src: /images/projects/cors-unblock.jpg
  alt: CORS Unblock asking whether a web app may access github.com, with Reject and Accept buttons
install:
  note: Chrome, Firefox and Safari · Free and open source

blocks:
  - type: steps
    title: How it works
    items:
      - A web app that needs cross-origin access asks you to install CORS Unblock.
      - When it wants to reach another domain, CORS Unblock asks you first, naming the site and the domain.
      - Accept, and only that site can reach only that domain. You can revoke it anytime.

  - type: list
    title: The details
    items:
      - title: Permission by permission.
        body: There is no global "disable CORS" switch. Each website gets access only to the domains you approved for it.
      - title: One place to manage it all.
        body: See and revoke every approval from the extension's settings.
      - title: Easy to integrate.
        body: Web developers use a small API to check for the extension and request access.
      - title: Inspired by Shizuku.
        body: >-
          Like Shizuku on Android, it's a central permission manager, so each web app doesn't need its own proxy
          server.

privacy:
  - CORS Unblock doesn't collect any data. Everything happens in your browser, and every approval can be revoked.
license: MIT
