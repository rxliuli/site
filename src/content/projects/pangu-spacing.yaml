# 详情页内容
icon: /images/projects/icons/pangu-spacing.png
tagline: Clean spacing between CJK and Latin text on every page.
intro: >-
  Reading mixed Chinese, Japanese, or Korean with English words, numbers, and symbols feels cramped without proper
  whitespace ("Pangu's White"). Pangu Spacing inserts it for you automatically or on demand. This is an unofficial
  cross-browser extension built on Vinta's [pangu.js](https://github.com/vinta/pangu.js) (MIT License), not affiliated
  with Vinta, and released under `GPL-3.0`.
screenshot:
  src: /images/projects/pangu-spacing.jpg
  alt: A Chinese technical article spaced by Pangu Spacing with the toolbar popup open
install:
  note: Firefox (desktop and Android) and Safari (macOS and iOS) · Free and open source

blocks:
  - type: features
    title: Space web pages your way
    items:
      - title: Automatic or manual spacing
        body: >-
          Automatically insert "Pangu's White" between CJK characters and half-width letters, digits, and symbols on
          page load, or turn off auto-spacing and trigger it from the toolbar popup only when you want it.
      - title: Blocklist and allowlist
        body: >-
          Control where spacing runs with either a site blocklist or allowlist, supporting `*` wildcard patterns for
          domains and URL paths.
      - title: SPA navigation support
        body: >-
          Tracks same-document navigation and dynamically updated pages, re-evaluating your site rules and applying
          spacing as you browse modern single-page apps.
      - title: Zen spacing
        body: >-
          Optionally use the browser's native CSS `text-autospace` instead of rewriting text nodes, for lightweight
          typographic spacing where supported.

  - type: list
    title: The details
    items:
      - title: Sound effects and off-state icon.
        body: >-
          Includes optional sound effects when spacing runs, and switches the toolbar icon to an off state on tabs
          where spacing is disabled.
      - title: Multilingual interface.
        body: >-
          The popup and options page come translated into English, Simplified Chinese (`zh-CN`), and Traditional
          Chinese (`zh-TW`).
      - title: Unofficial build based on pangu.js.
        body: >-
          Built on top of Vinta's [pangu.js](https://github.com/vinta/pangu.js) (MIT License) with a modern
          cross-browser setup for Firefox and Safari. Not affiliated with Vinta; licensed under `GPL-3.0`.

privacy:
  - >-
    100% local. All text spacing runs entirely inside your browser with zero remote requests, no telemetry, and no
    analytics.
  - >-
    No page content, browsing history, or personal data is ever collected or sent anywhere. Your preferences and URL
    rules stay in browser storage.
license: GPL-3.0 (based on pangu.js, MIT)
