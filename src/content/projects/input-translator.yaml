# 详情页内容
icon: /images/projects/icons/input-translator.png
tagline: Type in your language, send in theirs.
intro: >-
  Writing in a foreign language usually means a round trip to a translation tab. Input Translator translates the text
  in whatever box you're typing in, in place: press space three times and it's done.
screenshot:
  src: /images/projects/input-translator.jpg
  alt: A Reddit post editor with Japanese text produced by Input Translator
install:
  note: Chrome, Firefox and Safari · Free and open source

blocks:
  - type: features
    title: Three ways to trigger it
    items:
      - title: Triple space
        body: Press space three times at the end of your text and it's replaced with the translation.
      - title: Hotkey
        body: '`Alt+T` by default, and you can change it.'
      - title: Context menu
        body: Right-click and choose **Translate Text**.
      - title: Any input
        body: Plain text fields and rich text editors on any site, from Discord to Reddit.

  - type: list
    title: The details
    items:
      - title: Free by default.
        body: Google Translate needs no setup, and Microsoft Translator is a free alternative.
      - title: Bring your own model.
        body: Point it at OpenAI, or any OpenAI-compatible service such as OpenRouter, with your own key and model.
      - title: Any language pair.
        body: Auto-detect the source language or set it yourself, and pick your target language.

privacy:
  - >-
    Only the text you translate is sent, and only to the provider you choose: Google, Microsoft or your
    OpenAI-compatible endpoint.
  - >-
    The only other request is an anonymous usage ping, at most once a day: a random install ID, the extension version
    and your browser language.
