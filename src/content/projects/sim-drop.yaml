# 项目元数据：列表、首页卡片和详情页头部
title: "SimDrop"
description: "Booted iOS simulators show up in the Finder sidebar, so you can drag files into their Photos library or Downloads folder and drag them back out without leaving Finder."
type: App
tags: ["macOS", "iOS Simulator", "Swift", "Finder"]
previewImage: /images/projects/sim-drop.jpg
created: "2026-11-16"
updated: "2026-11-17"
