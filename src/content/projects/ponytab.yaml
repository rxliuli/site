# 详情页内容
icon: /images/projects/icons/ponytab.png
tagline: A new piece of pony art on every new tab, every day.
intro: >-
  PonyTab replaces the new tab page with My Little Pony artwork by Sam Baneko, a new piece each day, and nothing
  else: no widgets, no feed, no ads.
screenshot:
  src: /images/projects/ponytab.jpg
  alt: A PonyTab new tab page showing a full-screen pony illustration
install:
  note: Chrome, Edge and Firefox · Free and open source

blocks:
  - type: list
    title: The details
    items:
      - title: A new artwork each day.
        body: The picture changes daily, so every morning's first tab is a small surprise.
      - title: Just the art.
        body: A clean, minimal page with no ads and no tracking.
      - title: Used with permission.
        body: All artwork is by [Sam Baneko](https://spacecatsamba.com/) and is used with the artist's permission.

privacy:
  - >-
    PonyTab only connects to ponytab.rxliuli.com to fetch the day's artwork. There is no analytics and no tracking.
license: GPL-3.0
