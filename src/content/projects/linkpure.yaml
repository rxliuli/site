# 详情页内容
icon: /images/projects/icons/linkpure.png
tagline: Copy a link, get a clean one.
intro: >-
  Links you copy are full of `utm_` tags, `fbclid`, affiliate IDs, redirect wrappers and short links. LinkPure strips
  them out, so what you paste is just the link. Native on each platform, with the same rules everywhere.
install:
  command: brew install --cask rxliuli/tap/linkpure
  note: macOS 15 or later · iOS 17 or later · Android · Free and open source

blocks:
  - type: features
    title: One rule library, three platforms
    intro: Each platform works the way its system allows.
    items:
      - title: macOS
        body: >-
          Lives in the menu bar and watches the clipboard. Copy a link anywhere and it's cleaned before you paste, with
          a notification saying what changed. Nothing to do after setup.
      - title: iOS
        body: >-
          iOS doesn't let apps read the clipboard in the background, so LinkPure adds a **Clean URL Text** action to
          Shortcuts. The app walks you through a shortcut you can run from Control Center, Back Tap or Siri.
      - title: Android
        body: Select text anywhere and choose **Clean URL Text** from the selection menu. The clipboard is never touched.

  - type: features
    title: Works out of the box
    intro: Over 1,000 built-in rules, drawn from ClearURLs and Linkumori.
    items:
      - title: Strip tracking parameters
        body: '`utm_*`, `fbclid`, `gclid`, Amazon affiliate tags, YouTube `si` and `feature`, and social media tracking codes.'
      - title: Unwrap redirects
        body: Google `/url?q=` links, Facebook's link shim, Reddit outbound links and email tracking links resolve to the real URL.
      - title: Expand short links
        body: Links from t.co, bit.ly, TinyURL, goo.gl, lnkd.in and other shorteners are followed to where they actually go.
      - title: Only when it changes
        body: >-
          If a link is already clean, LinkPure leaves the clipboard alone, so copied rich text isn't flattened and
          Universal Clipboard isn't triggered for nothing.

  - type: list
    title: Your own rules
    intro: Write rules with regular expressions, test them against any URL, and import or export them as JSON.
    items:
      - title: Search elsewhere.
        body: Rewrite `google.com/search?q=…` to DuckDuckGo.
      - title: Shorts as videos.
        body: Turn `youtube.com/shorts/ID` into `youtube.com/watch?v=ID`.
      - title: Tidy notification links.
        body: Drop the email tracking query from Reddit notification links.
    note: >-
      The Homebrew and DMG builds share a bundle ID with the Mac App Store build, so installing one replaces the other.
      Pick one channel.

privacy:
  - >-
    Links are cleaned on your device. The only network requests LinkPure makes are for short links: to expand a t.co
    or bit.ly link it asks that service where the link points, without cookies, and follows the redirects.
  - There is no account and no analytics. The rewrite counter is kept on your device only.
