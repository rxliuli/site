# 详情页内容
icon: /images/projects/icons/jsonpath-finder.png
tagline: Jump to any key or value in a big JSON file.
intro: >-
  Scrolling through a large JSON file looking for one field is slow, and VS Code's search doesn't understand the
  structure. JSONPath Finder searches keys and values, or takes a JSONPath expression, and jumps to the node.
screenshot:
  src: /images/projects/jsonpath-finder.jpg
  alt: JSONPath Finder searching package.json in VS Code and highlighting the matching node
install:
  note: VS Code 1.105 or later · Free and open source

blocks:
  - type: steps
    title: How it works
    items:
      - Open a JSON or JSONC file.
      - 'Run **JSONPath Finder: Quick Navigate** from the Command Palette.'
      - Type to search, use the arrow keys to move through results, and press Enter to jump.

  - type: features
    title: Two ways to search
    items:
      - title: Fuzzy search
        body: Type any part of a key or value and matches show up as you type.
      - title: JSONPath
        body: Precise queries like `$.store.book[*].author` or `users[0].name`.

privacy:
  - JSONPath Finder works entirely inside VS Code. Nothing is sent anywhere.
license: MIT
