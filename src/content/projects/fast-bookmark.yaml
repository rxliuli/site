# 详情页内容
icon: /images/projects/icons/fast-bookmark.png
tagline: Bookmark into the right folder by typing its name.
intro: >-
  The built-in bookmark dialog makes you scroll a folder dropdown every time. Fast Bookmark asks for a folder name,
  autocompletes it, and saves when you press Enter.
screenshot:
  src: /images/projects/fast-bookmark.jpg
  alt: The Fast Bookmark popup autocompleting a bookmark folder name
install:
  note: Chrome and Firefox · Free and open source

blocks:
  - type: steps
    title: How it works
    items:
      - Open Fast Bookmark. Binding it to a shortcut like `Ctrl+D` makes it a drop-in replacement.
      - Type part of a folder name and pick from the suggestions.
      - Press **Enter** to save the page there.

  - type: list
    title: The details
    items:
      - title: Recent folders first.
        body: Folders you used recently come first in the suggestions.
      - title: Manifest V3.
        body: A modern rewrite of the original Fast Bookmark, which stopped working in current Chrome.
      - title: No Safari.
        body: Safari doesn't offer the bookmarks API that extensions need.

privacy:
  - Fast Bookmark only talks to your browser's own bookmarks. It makes no network requests and has no analytics.
